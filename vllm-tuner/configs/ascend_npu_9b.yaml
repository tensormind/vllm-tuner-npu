# Ascend NPU 适配配置 — 基于 qwen35-9b-fixed.sh
# 用法: python -m vllm_tuner.cli.main run --config configs/ascend_npu_9b.yaml
model: "/data/qwen3.5/Qwen3.5-9B"

study:
  name: ascend-9b-tune

optimization:
  preset: high_throughput
  objectives:
    - metric: output_tokens_per_sec
      direction: maximize
      weight: 1.0
  sampler: random
  n_trials: 1
  n_startup_trials: 1

hardware:
  accelerator: npu
  device_ids: [0]

execution:
  backend: local
  startup_timeout: 600  # 昇腾启动慢(权重加载+图捕获), 给10分钟

parameters:
  - name: gpu_memory_utilization
    min: 0.85
    max: 0.90
    step: 0.05

static_parameters:
  dtype: auto
  max_model_len: 8192
  tensor_parallel_size: 1
  trust_remote_code: true
  served_model_name: qwen3.5
  max_num_seqs: 8
  enforce_eager: true  # 跳过图捕获, 加速启动

benchmark:
  provider: http
  prompt_tokens: 128
  output_tokens: 32
  max_seconds: 30
  concurrent_requests: 4

output:
  directory: "./results_ascend"
  reports: ["json"]
